name: Roblox trend bot

on:
  schedule:
    # Every 20 minutes (at :07, :27, :47 — off-peak minutes start more reliably).
    # For a PRIVATE repo, change to "7,37 * * * *" (every 30 min) to stay inside
    # GitHub's free monthly minutes. Public repos have no minute limit.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      digest_now:
        description: "Post the daily digest now"
        type: boolean
        default: false
      test_webhooks:
        description: "Just post a hello to both Discord channels"
        type: boolean
        default: false
      weekly_now:
        description: "Post the weekly opportunity report now"
        type: boolean
        default: false
      check_sources:
        description: "Test YouTube / Roblox / Twitch / Discord access"
        type: boolean
        default: false

permissions:
  contents: write   # lets the bot back up its database to this repo's Releases page (private repos only)

concurrency:
  group: trendbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bot's memory (state.json + the trendbot.db database) lives in the Actions cache,
      # so nothing is committed to the repo on every run.
      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: trendbot-state-${{ github.run_id }}
          restore-keys: trendbot-state-

      - name: Run
        env:
          ROWATCHER_API_KEY: ${{ secrets.ROWATCHER_API_KEY }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
          DISCORD_DIGEST_WEBHOOK: ${{ secrets.DISCORD_DIGEST_WEBHOOK }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_PATH: state/state.json
          DB_PATH: state/trendbot.db
        run: |
          if [ "${{ inputs.test_webhooks }}" = "true" ]; then
            python bot.py --test-webhooks
          elif [ "${{ inputs.check_sources }}" = "true" ]; then
            python bot.py --check-sources
          elif [ "${{ inputs.digest_now }}" = "true" ]; then
            python bot.py --digest-now
          elif [ "${{ inputs.weekly_now }}" = "true" ]; then
            python bot.py --weekly-now
          else
            python bot.py
          fi

      - name: Save bot memory
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: trendbot-state-${{ github.run_id }}
